name: Benchmark 持续评测

on:
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/benchmark-live.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only trusted main commits run with private dataset access. Always evaluate the latest main
# at execution time, so delayed workflow runs cannot publish an older strategy snapshot.
concurrency:
  group: benchmark-live
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'lokinko/mario' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUTF8: '1'
      BENCHMARK_SCORING_TAG: ${{ vars.BENCHMARK_SCORING_TAG || 'pool-scoring-v8' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装锁定依赖
        run: |
          python -m pip install uv
          uv sync --frozen --group publish
      - name: 验证持续评测与数据边界
        run: uv run --frozen --group publish python -m unittest benchmark.tests.test_live benchmark.tests.test_strategy_runner benchmark.tests.test_dashboard benchmark.tests.test_benchmark -q
      - name: 评测主分支策略并发布实时状态
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$HF_TOKEN" || { echo '缺少仓库 Secret HF_TOKEN'; exit 1; }
          uv run --frozen --group publish python -m benchmark.live evaluate --tag "$BENCHMARK_SCORING_TAG" --commit "$(git rev-parse HEAD)" --run-url "$BENCHMARK_RUN_URL"
