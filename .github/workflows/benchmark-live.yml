name: Benchmark 持续评测

on:
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/benchmark-live.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only trusted main commits run with private dataset access. Always evaluate the latest main
# at execution time, so delayed workflow runs cannot publish an older strategy snapshot.
concurrency:
  # 与每日行情共用 HF 标签仓库主分支，串行保护固定父提交。
  group: benchmark-hf-main
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'lokinko/mario' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PYTHONUTF8: '1'
      BENCHMARK_PLAN_REVISION: ${{ vars.BENCHMARK_PLAN_REVISION || 'pool-scoring-v8' }}
      BENCHMARK_RAW_REVISION: ${{ vars.BENCHMARK_RAW_REVISION || 'baostock-daily-20261102' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装锁定依赖
        run: |
          python -m pip install uv
          uv sync --frozen --group publish
      - name: 验证持续评测与数据边界
        run: uv run --frozen --group publish python -m unittest discover -s benchmark/tests -q
      - name: 获取原始行情与评分计划（不下载预计算输入）
        run: |
          test -n "$HF_TOKEN" || { echo '缺少仓库 Secret HF_TOKEN'; exit 1; }
          uv run --frozen --group publish python -m benchmark.live prepare --plan-revision "$BENCHMARK_PLAN_REVISION" --raw-revision "$BENCHMARK_RAW_REVISION" --workspace .runtime/benchmark/workflow
      - name: 按策略依赖计算指标、评测并发布
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --frozen --group publish python -m benchmark.live evaluate --workspace .runtime/benchmark/workflow --commit "$(git rev-parse HEAD)" --run-url "$BENCHMARK_RUN_URL"
