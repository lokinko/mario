[package]
name = "mario"
version = "0.5.0"
description = "Desktop and Android client for mario"
authors = ["mario"]
edition = "2021"
rust-version = "1.86"

[lib]
name = "mario_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-shell = "=2.3.0"
tauri-plugin-notification = "=2.3.3"
# Lock transitive build crates to versions compatible with the declared toolchain.
icu_collections = "=2.2.0"
icu_locale_core = "=2.2.0"
icu_normalizer = "=2.2.0"
icu_normalizer_data = "=2.2.0"
icu_properties = "=2.2.0"
icu_properties_data = "=2.2.0"
icu_provider = "=2.2.0"
plist = "=1.7.2"
serde_with = "=3.14.0"
time = "=0.3.41"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The desktop notification plugin's broad range otherwise selects 4.18, which requires Rust 1.89.
notify-rust = "=4.17.0"

[target.'cfg(target_os = "android")'.dependencies]
android-keyring = "=0.2.0"
mario-server = { path = "../../server" }
