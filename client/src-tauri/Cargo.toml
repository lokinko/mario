[package]
name = "compass-invest"
version = "0.1.5"
description = "Desktop client for Compass Invest"
authors = ["Compass Invest"]
edition = "2021"
rust-version = "1.86"

[lib]
name = "compass_invest_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-shell = "=2.3.0"
tauri-plugin-notification = "=2.3.3"
# The notification plugin's broad range otherwise selects 4.18, which requires Rust 1.89.
notify-rust = "=4.17.0"
# Lock transitive build crates to versions compatible with the declared toolchain.
icu_collections = "=2.2.0"
icu_locale_core = "=2.2.0"
icu_normalizer = "=2.2.0"
icu_normalizer_data = "=2.2.0"
icu_properties = "=2.2.0"
icu_properties_data = "=2.2.0"
icu_provider = "=2.2.0"
plist = "=1.7.2"
serde_with = "=3.14.0"
time = "=0.3.41"
