[package]
name = "compass-server"
version = "0.1.0"
description = "Local API, investment methodology and AI orchestration service"
edition = "2021"
rust-version = "1.86"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# reqwest/url currently allow newer ICU4X releases requiring Rust 1.88.
# These exact constraints keep builds reproducible on the declared toolchain.
icu_collections = "=2.2.0"
icu_locale_core = "=2.2.0"
icu_normalizer = "=2.2.0"
icu_normalizer_data = "=2.2.0"
icu_properties = "=2.2.0"
icu_properties_data = "=2.2.0"
icu_provider = "=2.2.0"

[dev-dependencies]
tempfile = "3"
